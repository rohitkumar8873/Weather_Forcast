resources:
  jobs:
    Weather_forcast:
      name: Weather_forcast
      schedule:
        quartz_cron_expression: 44 0 6 * * ?
        timezone_id: Asia/Calcutta
        pause_status: PAUSED
      tasks:
        - task_key: fetch_ingest
          notebook_task:
            notebook_path: /Workspace/Users/rohitsauro21@gmail.com/Weather_Forcast/Weather/Bronze/Fetch
              and Ingest weather data
            base_parameters:
              city: "{{job.parameters.city}}"
            source: WORKSPACE
        - task_key: current_weather
          depends_on:
            - task_key: fetch_ingest
          notebook_task:
            notebook_path: /Workspace/Users/rohitsauro21@gmail.com/Weather_Forcast/Weather/Silver/current_weather
            source: WORKSPACE
        - task_key: gold_dim_location
          depends_on:
            - task_key: current_weather
          notebook_task:
            notebook_path: /Workspace/Users/rohitsauro21@gmail.com/Weather_Forcast/Weather/Gold/gold_dim_location
            source: WORKSPACE
        - task_key: gold_fact_current_weather
          depends_on:
            - task_key: gold_dim_location
            - task_key: current_weather
          notebook_task:
            notebook_path: /Workspace/Users/rohitsauro21@gmail.com/Weather_Forcast/Weather/Gold/gold_fact_current_weather
            source: WORKSPACE
        - task_key: silver_daily_weather
          depends_on:
            - task_key: fetch_ingest
          notebook_task:
            notebook_path: /Workspace/Users/rohitsauro21@gmail.com/Weather_Forcast/Weather/Silver/silver_daily_weather
            source: WORKSPACE
        - task_key: gold_dim_weather_forecast_scd2
          depends_on:
            - task_key: silver_daily_weather
            - task_key: gold_dim_location
          notebook_task:
            notebook_path: /Workspace/Users/rohitsauro21@gmail.com/Weather_Forcast/Weather/Gold/gold_dim_weather_forecast_scd2
            source: WORKSPACE
          disabled: true
        - task_key: gold_fact_daily_weather
          depends_on:
            - task_key: gold_dim_location
            - task_key: silver_daily_weather
          notebook_task:
            notebook_path: /Workspace/Users/rohitsauro21@gmail.com/Weather_Forcast/Weather/Gold/gold_fact_daily_weather
            source: WORKSPACE
        - task_key: gold_dashboard_kpis
          depends_on:
            - task_key: gold_fact_current_weather
            - task_key: gold_fact_daily_weather
          notebook_task:
            notebook_path: /Workspace/Users/rohitsauro21@gmail.com/Weather_Forcast/Weather/Gold/gold_dashboard_kpis
            source: WORKSPACE
        - task_key: Dashboard
          depends_on:
            - task_key: gold_dashboard_kpis
          dashboard_task:
            subscription:
              subscribers:
                - user_name: rohitsauro21@gmail.com
              paused: false
            warehouse_id: 86c1e19296d0f3b7
            dashboard_id: 01f19f7be57d1b5aa18471263149561c
        - task_key: silver_hourly_weather
          depends_on:
            - task_key: fetch_ingest
          notebook_task:
            notebook_path: /Workspace/Users/rohitsauro21@gmail.com/Weather_Forcast/Weather/Silver/silver_hourly_weather
            source: WORKSPACE
        - task_key: gold_fact_hourly_weather
          depends_on:
            - task_key: gold_dim_location
            - task_key: silver_hourly_weather
          notebook_task:
            notebook_path: /Workspace/Users/rohitsauro21@gmail.com/Weather_Forcast/Weather/Gold/gold_fact_hourly_weather
            source: WORKSPACE
        - task_key: gold_data_quality
          depends_on:
            - task_key: gold_dim_location
            - task_key: gold_fact_daily_weather
            - task_key: gold_fact_hourly_weather
            - task_key: gold_fact_current_weather
            - task_key: gold_dim_weather_forecast_scd2
          run_if: AT_LEAST_ONE_SUCCESS
          notebook_task:
            notebook_path: /Workspace/Users/rohitsauro21@gmail.com/Weather_Forcast/Weather/Gold/gold_data_quality
            source: WORKSPACE
          disabled: true
        - task_key: silver_data_quality
          depends_on:
            - task_key: silver_hourly_weather
            - task_key: current_weather
            - task_key: silver_daily_weather
          notebook_task:
            notebook_path: /Workspace/Users/rohitsauro21@gmail.com/Weather_Forcast/Weather/Silver/silver_data_quality
            source: WORKSPACE
      git_source:
        git_url: https://github.com/rohitkumar8873/Weather_Forcast
        git_provider: gitHub
        git_branch: developer
      queue:
        enabled: true
      parameters:
        - name: city
          default: Piro
      performance_target: PERFORMANCE_OPTIMIZED
